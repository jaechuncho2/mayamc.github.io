<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="메이동물의료센터 소동물 최신 수의학 논문 아카이브" />
  <title>최신 수의학 논문 | 메이동물의료센터</title>
  <style>
    :root {
      --navy: #14304a;
      --navy-2: #1d4567;
      --blue: #2f6f9f;
      --sky: #eaf3f8;
      --bg: #f5f7f9;
      --card: #ffffff;
      --text: #17212b;
      --muted: #697782;
      --line: #dbe3e8;
      --gold: #e0a821;
      --danger: #b84a4a;
      --shadow: 0 8px 28px rgba(19, 48, 74, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      line-height: 1.6;
    }
    button, input, select { font: inherit; }
    a { color: inherit; }

    .hero {
      background:
        radial-gradient(circle at 85% 10%, rgba(120, 190, 220, .22), transparent 34%),
        linear-gradient(135deg, var(--navy), var(--navy-2));
      color: white;
      padding: 52px 20px 42px;
    }
    .hero-inner, .container {
      width: min(1180px, 100%);
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      opacity: .78;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.18;
      letter-spacing: -.035em;
    }
    .subtitle {
      margin: 14px 0 0;
      color: rgba(255,255,255,.82);
      font-size: 16px;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 24px;
      color: rgba(255,255,255,.75);
      font-size: 13px;
    }

    .container { padding: 28px 20px 64px; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin-bottom: 24px;
      padding: 18px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-row + .toolbar-row { margin-top: 13px; }
    .toolbar-label {
      min-width: 72px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex: 1;
    }
    .chip, .action-btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
      transition: .18s ease;
      white-space: nowrap;
    }
    .chip:hover, .action-btn:hover {
      border-color: var(--blue);
      transform: translateY(-1px);
    }
    .chip.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }
    .chip.starred.active {
      background: #fff7d8;
      color: #725300;
      border-color: #e8c75b;
    }

    .control {
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text);
      min-height: 42px;
    }
    .search {
      flex: 1 1 240px;
      min-width: 190px;
    }
    .journal-select { max-width: 310px; }
    .refresh-btn {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 16px 2px;
      color: var(--muted);
      font-size: 14px;
    }
    #statusMessage.error { color: var(--danger); }

    .paper-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .paper-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 270px;
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 18px rgba(19,48,74,.045);
      transition: .2s ease;
    }
    .paper-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: #c8d6df;
    }
    .paper-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .journal {
      color: var(--blue);
      font-weight: 800;
      font-size: 13px;
      line-height: 1.35;
    }
    .date {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .paper-title {
      margin: 13px 40px 10px 0;
      font-size: 18px;
      line-height: 1.45;
      letter-spacing: -.012em;
    }
    .authors {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .korean-summary {
      margin: 8px 0 14px;
      padding: 14px 15px;
      background: #f0f6fa;
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      color: #243946;
      font-size: 14px;
      line-height: 1.68;
    }
    .korean-summary-label {
      display: block;
      margin-bottom: 4px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
    }
    .summary-pending {
      color: var(--muted);
      background: #f7f8f9;
      border-left-color: #aeb9c0;
    }
    .abstract-toggle {
      margin: 0 0 14px;
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }
    .abstract-toggle:hover { text-decoration: underline; }
    .abstract-panel {
      display: none;
      margin: 0 0 17px;
      padding: 14px;
      background: #fafbfc;
      border: 1px solid #e6ecef;
      border-radius: 10px;
    }
    .abstract-panel.open { display: block; }
    .abstract-heading {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
    }
    .korean-detail {
      margin: 0 0 13px;
      color: #344b59;
      font-size: 14px;
      white-space: pre-line;
    }
    .abstract {
      color: #46535e;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0 0 18px;
    }
    .paper-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #eef2f4;
    }
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 4px 8px;
      background: var(--sky);
      border-radius: 999px;
      color: #315e7d;
      font-size: 11px;
      font-weight: 700;
    }
    .pubmed-link {
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .pubmed-link:hover { text-decoration: underline; }
    .star-btn {
      position: absolute;
      right: 18px;
      top: 52px;
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
      filter: grayscale(1);
      opacity: .55;
    }
    .star-btn:hover { background: #fff8dc; opacity: 1; }
    .star-btn.saved { filter: none; opacity: 1; }

    .empty, .loading {
      grid-column: 1 / -1;
      padding: 56px 20px;
      text-align: center;
      background: white;
      border: 1px dashed #cbd6dd;
      border-radius: var(--radius);
      color: var(--muted);
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 13px;
      border: 3px solid #dce6ec;
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more {
      display: none;
      margin: 24px auto 0;
      padding: 11px 22px;
    }

    footer {
      padding: 30px 20px;
      background: #102538;
      color: rgba(255,255,255,.68);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .paper-list { grid-template-columns: 1fr; }
      .toolbar { position: static; }
      .toolbar-label { width: 100%; min-width: 0; }
      .journal-select { max-width: none; width: 100%; }
      .sort-select { flex: 1; }
    }
    @media (max-width: 520px) {
      .hero { padding-top: 38px; }
      .container { padding-left: 13px; padding-right: 13px; }
      .toolbar { padding: 14px; border-radius: 13px; }
      .paper-card { padding: 18px; }
      .paper-title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">MAY ANIMAL MEDICAL CENTER · RESEARCH</p>
      <h1>소동물 최신 수의학 논문</h1>
      <p class="subtitle">주요 수의학 저널의 최신 논문과 한글 핵심 요약을 자동으로 업데이트합니다.</p>
      <div class="hero-meta">
        <span>대상: 개·고양이 임상 연구</span>
        <span id="lastUpdated">업데이트 확인 중</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="논문 필터">
      <div class="toolbar-row">
        <span class="toolbar-label">분야</span>
        <div id="categoryButtons" class="filter-buttons"></div>
      </div>

      <div class="toolbar-row">
        <span class="toolbar-label">검색·정렬</span>
        <input id="searchInput" class="control search" type="search"
          placeholder="논문 제목, 저널 또는 저자 검색" aria-label="논문 검색" />
        <select id="journalSelect" class="control journal-select" aria-label="저널 선택">
          <option value="all">전체 저널</option>
        </select>
        <select id="sortSelect" class="control sort-select" aria-label="정렬">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="journal">저널순</option>
        </select>
        <button id="refreshButton" class="action-btn refresh-btn" type="button">새로고침</button>
      </div>
    </section>

    <div class="status-bar">
      <span id="resultCount">논문을 불러오는 중입니다.</span>
      <span id="statusMessage"></span>
    </div>

    <section id="paperList" class="paper-list" aria-live="polite">
      <div class="loading"><div class="spinner"></div>저널별 최신 논문 데이터를 불러오는 중입니다.</div>
    </section>

    <button id="loadMoreButton" class="action-btn load-more" type="button">논문 더 보기</button>
  </main>

  <footer>
    © 메이동물의료센터 · 데이터 출처: PubMed (NCBI)
  </footer>

  <script>
    const CATEGORY_JOURNALS = {
      cardiology: [
        "Journal of Veterinary Cardiology",
        "Journal of Veterinary Internal Medicine",
        "American Journal of Veterinary Research",
        "Journal of Small Animal Practice",
        "Journal of the American Veterinary Medical Association",
        "Veterinary Medicine and Science",
        "Frontiers in Veterinary Science"
      ],
      internalMedicine: [
        "Journal of Veterinary Internal Medicine",
        "Veterinary Record",
        "The Veterinary Journal",
        "BMC Veterinary Research",
        "Veterinary Research Communications",
        "Journal of Veterinary Medical Science",
        "Topics in Companion Animal Medicine",
        "Journal of Feline Medicine and Surgery",
        "JFMS Open Reports"
      ],
      oncology: [
        "Journal of Veterinary Internal Medicine",
        "Veterinary and Comparative Oncology",
        "Veterinary Sciences",
        "Frontiers in Veterinary Science",
        "Journal of Small Animal Practice",
        "Veterinary Medicine and Science"
      ],
      surgery: [
        "Veterinary Surgery",
        "Veterinary and Comparative Orthopaedics and Traumatology",
        "Veterinary Radiology & Ultrasound",
        "Journal of Small Animal Practice"
      ],
      neurology: [
        "Journal of Veterinary Internal Medicine",
        "Veterinary Record",
        "Frontiers in Veterinary Science",
        "Journal of Veterinary Medical Science",
        "BMC Veterinary Research"
      ],
      dermatology: [
        "Veterinary Dermatology",
        "Veterinary Sciences",
        "BMC Veterinary Research",
        "Veterinary Research Communications",
        "Journal of Feline Medicine and Surgery"
      ]
    };

    const CATEGORY_LABELS = {
      all: "전체",
      cardiology: "심장",
      internalMedicine: "내과",
      oncology: "종양",
      surgery: "외과",
      neurology: "신경",
      dermatology: "피부",
      starred: "⭐ 찜한 논문"
    };

    // PubMed에 등록된 약칭·표기 차이를 화면의 정식 저널명으로 통합합니다.
    const JOURNAL_ALIASES = {
      "J Vet Cardiol": "Journal of Veterinary Cardiology",
      "J Vet Intern Med": "Journal of Veterinary Internal Medicine",
      "Am J Vet Res": "American Journal of Veterinary Research",
      "J Small Anim Pract": "Journal of Small Animal Practice",
      "J Am Vet Med Assoc": "Journal of the American Veterinary Medical Association",
      "Vet Med Sci": "Veterinary Medicine and Science",
      "Front Vet Sci": "Frontiers in Veterinary Science",
      "Vet Rec": "Veterinary Record",
      "Vet J": "The Veterinary Journal",
      "BMC Vet Res": "BMC Veterinary Research",
      "Vet Res Commun": "Veterinary Research Communications",
      "J Vet Med Sci": "Journal of Veterinary Medical Science",
      "Top Companion Anim Med": "Topics in Companion Animal Medicine",
      "J Feline Med Surg": "Journal of Feline Medicine and Surgery",
      "JFMS Open Rep": "JFMS Open Reports",
      "Vet Comp Oncol": "Veterinary and Comparative Oncology",
      "Vet Sci": "Veterinary Sciences",
      "Vet Surg": "Veterinary Surgery",
      "Vet Comp Orthop Traumatol": "Veterinary and Comparative Orthopaedics and Traumatology",
      "Vet Radiol Ultrasound": "Veterinary Radiology & Ultrasound",
      "Vet Dermatol": "Veterinary Dermatology"
    };

    const ALL_JOURNALS = [...new Set(Object.values(CATEGORY_JOURNALS).flat())].sort();
    const PAGE_SIZE = 20;
    const RESULTS_PER_JOURNAL = 20;
    const CACHE_KEY = "mayamc_pubmed_cache_v3";
    const PAPERS_URL = "./data/papers.json";
    const CACHE_TTL = 6 * 60 * 60 * 1000;
    const STAR_KEY = "mayamc_starred_pmids_v1";
    const SUMMARY_URL = "./data/korean-summaries.json";

    let koreanSummaries = {};
    let allPapers = [];
    let visibleCount = PAGE_SIZE;
    let activeCategory = "all";
    let starredPmids = new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]"));

    const els = {
      categoryButtons: document.getElementById("categoryButtons"),
      journalSelect: document.getElementById("journalSelect"),
      sortSelect: document.getElementById("sortSelect"),
      searchInput: document.getElementById("searchInput"),
      paperList: document.getElementById("paperList"),
      resultCount: document.getElementById("resultCount"),
      statusMessage: document.getElementById("statusMessage"),
      refreshButton: document.getElementById("refreshButton"),
      loadMoreButton: document.getElementById("loadMoreButton"),
      lastUpdated: document.getElementById("lastUpdated")
    };

    function buildControls() {
      Object.entries(CATEGORY_LABELS).forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip ${key === "all" ? "active" : ""} ${key === "starred" ? "starred" : ""}`;
        button.dataset.category = key;
        button.textContent = label;
        button.addEventListener("click", () => {
          activeCategory = key;
          visibleCount = PAGE_SIZE;
          document.querySelectorAll("#categoryButtons .chip").forEach(btn =>
            btn.classList.toggle("active", btn.dataset.category === key)
          );
          updateJournalOptions();
          render();
        });
        els.categoryButtons.appendChild(button);
      });

      updateJournalOptions();

      els.searchInput.addEventListener("input", () => {
        visibleCount = PAGE_SIZE;
        render();
      });
      els.journalSelect.addEventListener("change", () => {
        visibleCount = PAGE_SIZE;
        render();
      });
      els.sortSelect.addEventListener("change", render);
      els.refreshButton.addEventListener("click", () => fetchPapers(true));
      els.loadMoreButton.addEventListener("click", () => {
        visibleCount += PAGE_SIZE;
        render();
      });
    }

    function updateJournalOptions() {
      const previous = els.journalSelect.value;
      const journals = activeCategory in CATEGORY_JOURNALS
        ? CATEGORY_JOURNALS[activeCategory]
        : ALL_JOURNALS;

      els.journalSelect.innerHTML = '<option value="all">전체 저널</option>';
      [...journals].sort().forEach(journal => {
        const option = document.createElement("option");
        option.value = journal;
        option.textContent = journal;
        els.journalSelect.appendChild(option);
      });
      els.journalSelect.value = journals.includes(previous) ? previous : "all";
    }

    function normalizeJournal(rawJournal = "") {
      const clean = rawJournal.replace(/\.$/, "").trim();
      return JOURNAL_ALIASES[clean] || clean;
    }

    function getCategoriesForJournal(journal) {
      return Object.entries(CATEGORY_JOURNALS)
        .filter(([, journals]) => journals.includes(journal))
        .map(([category]) => category);
    }

    function escapeHtml(value = "") {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseDate(raw = "") {
      if (!raw) return new Date(0);
      const normalized = raw
        .replace(/^(\d{4})\s([A-Za-z]{3})\s(\d{1,2}).*$/, "$1 $2 $3")
        .replace(/^(\d{4})\s([A-Za-z]{3}).*$/, "$1 $2 01")
        .replace(/^(\d{4}).*$/, "$1 Jan 01");
      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? new Date(0) : date;
    }

    function formatDate(date) {
      if (!date || date.getTime() === 0) return "날짜 미상";
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "2-digit", day: "2-digit"
      }).format(date);
    }

    function buildJournalQuery(journal) {
      const speciesTerms = [
        "dog[Title/Abstract]", "dogs[Title/Abstract]", "canine[Title/Abstract]",
        "cat[Title/Abstract]", "cats[Title/Abstract]", "feline[Title/Abstract]"
      ].join(" OR ");
      return `("${journal}"[Journal] AND (${speciesTerms}))`;
    }

    async function fetchIdsByJournal(base) {
      // NCBI 요청을 한꺼번에 과도하게 보내지 않도록 저널별로 순차 조회합니다.
      const ids = [];
      for (const journal of ALL_JOURNALS) {
        const query = encodeURIComponent(buildJournalQuery(journal));
        const url =
          `${base}/esearch.fcgi?db=pubmed&retmode=json&sort=pub+date` +
          `&retmax=${RESULTS_PER_JOURNAL}&term=${query}`;
        try {
          const data = await fetchJson(url);
          const journalIds = data?.esearchresult?.idlist || [];
          ids.push(...journalIds);
        } catch (error) {
          console.warn(`Journal search failed: ${journal}`, error);
        }
        // NCBI E-utilities의 비인증 요청 속도를 과도하게 높이지 않기 위한 짧은 간격
        await new Promise(resolve => setTimeout(resolve, 120));
      }
      return [...new Set(ids)];
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`PubMed 요청 실패 (${response.status})`);
      return response.json();
    }

    async function fetchText(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`PubMed 요청 실패 (${response.status})`);
      return response.text();
    }

    async function loadKoreanSummaries() {
      try {
        const response = await fetch(`${SUMMARY_URL}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`요약 파일 요청 실패 (${response.status})`);
        const data = await response.json();
        koreanSummaries = data.summaries || {};
      } catch (error) {
        console.warn("Korean summaries unavailable:", error);
        koreanSummaries = {};
      }
    }

    async function fetchPapers(force = false) {
      els.statusMessage.className = "";
      els.statusMessage.textContent = "";
      els.paperList.innerHTML =
        '<div class="loading"><div class="spinner"></div>최신 논문 목록을 불러오는 중입니다.</div>';
      els.resultCount.textContent = "논문을 불러오는 중입니다.";
      els.refreshButton.disabled = true;

      try {
        const response = await fetch(`${PAPERS_URL}?v=${Date.now()}`);
        if (!response.ok) throw new Error(`논문 목록 요청 실패 (${response.status})`);
        const data = await response.json();

        allPapers = (data.papers || []).map(paper => ({
          ...paper,
          dateObject: new Date(paper.dateObject || paper.date || 0)
        }));

        if (data.updated_at) {
          setUpdatedTime(new Date(data.updated_at).getTime(), false);
        } else {
          els.lastUpdated.textContent = "논문 데이터 업데이트 대기 중";
        }

        if (!allPapers.length) {
          els.statusMessage.textContent =
            "아직 논문 데이터가 없습니다. GitHub Actions를 한 번 실행해 주세요.";
        }
        render();
      } catch (error) {
        console.error(error);
        els.paperList.innerHTML = `
          <div class="empty">
            논문 목록을 불러오지 못했습니다.<br>
            GitHub Actions 실행 결과와 data/papers.json 파일을 확인해 주세요.
          </div>`;
        els.resultCount.textContent = "불러오기 실패";
        els.statusMessage.className = "error";
        els.statusMessage.textContent = error.message;
      } finally {
        els.refreshButton.disabled = false;
      }
    }


    function filteredPapers() {
      const term = els.searchInput.value.trim().toLowerCase();
      const selectedJournal = els.journalSelect.value;

      let papers = allPapers.filter(paper => {
        const categoryMatch =
          activeCategory === "all" ||
          (activeCategory === "starred" && starredPmids.has(paper.pmid)) ||
          paper.categories.includes(activeCategory);

        const journalMatch =
          selectedJournal === "all" || paper.journal === selectedJournal;

        const haystack = `${paper.title} ${paper.journal} ${paper.authors} ${paper.abstract}`.toLowerCase();
        const searchMatch = !term || haystack.includes(term);

        return categoryMatch && journalMatch && searchMatch;
      });

      const sort = els.sortSelect.value;
      papers.sort((a, b) => {
        if (sort === "oldest") return a.dateObject - b.dateObject;
        if (sort === "journal") {
          return a.journal.localeCompare(b.journal) || b.dateObject - a.dateObject;
        }
        return b.dateObject - a.dateObject;
      });

      return papers;
    }

    function render() {
      const papers = filteredPapers();
      const visible = papers.slice(0, visibleCount);
      els.resultCount.textContent = `총 ${papers.length.toLocaleString()}편`;

      if (!visible.length) {
        els.paperList.innerHTML = `
          <div class="empty">
            조건에 맞는 논문이 없습니다.<br>
            분야, 저널 또는 검색어를 변경해 주세요.
          </div>`;
        els.loadMoreButton.style.display = "none";
        return;
      }

      els.paperList.innerHTML = visible.map(paper => {
        const saved = starredPmids.has(paper.pmid);
        const categoryTags = paper.categories
          .map(category => `<span class="tag">${CATEGORY_LABELS[category]}</span>`)
          .join("");

        const ko = koreanSummaries[paper.pmid];
        const briefSummary = ko?.brief_summary
          ? escapeHtml(ko.brief_summary)
          : "한글 요약 생성 대기 중입니다. 자동 업데이트 후 표시됩니다.";
        const detailSummary = ko?.detailed_summary
          ? escapeHtml(ko.detailed_summary)
          : "한글 상세 요약이 아직 생성되지 않았습니다.";
        const summaryClass = ko?.brief_summary ? "" : " summary-pending";
        const panelId = `abstract-panel-${paper.pmid}`;

        return `
          <article class="paper-card">
            <div class="paper-top">
              <span class="journal">${escapeHtml(paper.journal)}</span>
              <span class="date">${formatDate(paper.dateObject)}</span>
            </div>
            <button class="star-btn ${saved ? "saved" : ""}"
              type="button" data-pmid="${paper.pmid}"
              aria-label="${saved ? "찜 해제" : "논문 찜하기"}"
              title="${saved ? "찜 해제" : "논문 찜하기"}">⭐</button>
            <h2 class="paper-title">${escapeHtml(paper.title)}</h2>
            <div class="korean-summary${summaryClass}">
              <span class="korean-summary-label">한글 핵심 요약</span>
              ${briefSummary}
            </div>
            <div class="authors">${escapeHtml(paper.authors || "저자 정보 없음")}</div>
            <button class="abstract-toggle" type="button"
              data-panel="${panelId}" aria-expanded="false">한글 상세 요약·영문 초록 보기 ▾</button>
            <div id="${panelId}" class="abstract-panel">
              <p class="abstract-heading">한글 상세 요약</p>
              <p class="korean-detail">${detailSummary}</p>
              <p class="abstract-heading">영문 초록</p>
              <p class="abstract">${escapeHtml(paper.abstract || "PubMed에 등록된 초록이 없습니다.")}</p>
            </div>
            <div class="paper-footer">
              <div class="tags">${categoryTags}</div>
              <a class="pubmed-link" href="https://pubmed.ncbi.nlm.nih.gov/${paper.pmid}/"
                target="_blank" rel="noopener noreferrer">PubMed 보기 →</a>
            </div>
          </article>`;
      }).join("");

      document.querySelectorAll(".star-btn").forEach(button => {
        button.addEventListener("click", () => toggleStar(button.dataset.pmid));
      });

      document.querySelectorAll(".abstract-toggle").forEach(button => {
        button.addEventListener("click", () => {
          const panel = document.getElementById(button.dataset.panel);
          const isOpen = panel.classList.toggle("open");
          button.setAttribute("aria-expanded", String(isOpen));
          button.textContent = isOpen
            ? "한글 상세 요약·영문 초록 닫기 ▴"
            : "한글 상세 요약·영문 초록 보기 ▾";
        });
      });

      els.loadMoreButton.style.display = visibleCount < papers.length ? "block" : "none";
    }

    function toggleStar(pmid) {
      if (starredPmids.has(pmid)) starredPmids.delete(pmid);
      else starredPmids.add(pmid);
      localStorage.setItem(STAR_KEY, JSON.stringify([...starredPmids]));
      render();
    }

    function setUpdatedTime(timestamp, cached) {
      const date = new Date(timestamp);
      els.lastUpdated.textContent =
        `${cached ? "저장 목록" : "최종 업데이트"}: ` +
        new Intl.DateTimeFormat("ko-KR", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit"
        }).format(date);
    }

    buildControls();
    Promise.all([loadKoreanSummaries(), fetchPapers(false)]).then(() => render());
  </script>
</body>
</html>
